version: '3.8'

services:
  traffic-counter:
    build: .
    container_name: traffic-counter
    restart: unless-stopped
    environment:
      # RTSP настройки
      - RTSP_URL=rtsp://username:password@192.168.1.64:554/Streaming/Channels/101
      
      # YOLO настройки
      - YOLO_MODEL=yolov8n.pt
      - CONFIDENCE_THRESHOLD=0.5
      
      # Настройки подсчета
      - LINE_POSITION=400
      - LINE_THICKNESS=5
      - COUNTING_DIRECTION=down
      
      # Настройки видео
      - SHOW_VIDEO=false
      - SAVE_VIDEO=false
      - OUTPUT_VIDEO_PATH=/app/output.avi
      
      # Логирование
      - LOG_LEVEL=INFO
    volumes:
      - ./output:/app/output
    network_mode: host
    # Для отображения видео (требует X11 forwarding)
    # Если нужен GUI, раскомментируйте:
    # environment:
    #   - DISPLAY=${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw

